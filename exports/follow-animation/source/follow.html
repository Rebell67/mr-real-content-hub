<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1080px; height: 1920px; background: transparent; overflow: hidden; }
  body { font-family: 'Inter', sans-serif; }
  #stage { position: absolute; inset: 0; }

  #card {
    position: absolute; left: 50%; top: 50%;
    width: 940px; height: 210px; margin-left: -470px; margin-top: -105px;
    border-radius: 105px;
    background: rgba(11, 14, 20, 0.94);
    box-shadow: 0 0 0 2px rgba(255,255,255,0.08) inset, 0 30px 80px -20px rgba(0,0,0,0.6);
    display: flex; align-items: center; padding: 0 28px 0 30px; box-sizing: border-box;
    transform-origin: 50% 50%;
  }
  #avatar {
    width: 150px; height: 150px; border-radius: 50%; flex: none; position: relative;
    background: linear-gradient(135deg, #12D99A 0%, #00A374 55%, #EFA92B 100%);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 800; font-size: 60px; letter-spacing: -2px;
    box-shadow: 0 0 0 5px rgba(11,14,20,1), 0 0 0 9px #00C389;
  }
  #text { flex: 1; margin-left: 32px; min-width: 0; }
  #name { color: #fff; font-weight: 800; font-size: 50px; letter-spacing: -1px; line-height: 1.05; }
  #sub  { color: rgba(255,255,255,0.6); font-weight: 500; font-size: 30px; margin-top: 8px; }

  #btn {
    position: relative; height: 104px; border-radius: 52px; flex: none;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 40px; letter-spacing: -0.5px;
    transform-origin: 50% 50%;
  }
  .label { position: absolute; display: flex; align-items: center; gap: 12px; white-space: nowrap; }

  #ring, .p { position: absolute; pointer-events: none; }
  #ring { border-radius: 50%; border: 8px solid #00C389; box-sizing: border-box; }
  .p { border-radius: 50%; }

  #cursor { position: absolute; left: 0; top: 0; width: 110px; height: 150px; transform-origin: 0 0; }
</style>
</head>
<body>
<div id="stage">
  <div id="card">
    <div id="avatar">IR</div>
    <div id="text">
      <div id="name">Immo Rebellen</div>
      <div id="sub">Immobilien &amp; Investment</div>
    </div>
    <div id="btn">
      <div class="label" id="l1">Folgen</div>
      <div class="label" id="l2">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>
        Gefolgt
      </div>
    </div>
  </div>
  <div id="ring"></div>
  <div id="particles"></div>
  <svg id="cursor" viewBox="-4 -4 30 40">
    <path d="M0 0 L0 26 L6.5 20 L11 30.5 L15.5 28.5 L11 18.5 L20 18.5 Z"
          fill="#fff" stroke="#0B0E14" stroke-width="2" stroke-linejoin="round"/>
  </svg>
</div>

<script>
const FPS = 30, DURATION = 3.6;
const $ = (id) => document.getElementById(id);
const card = $('card'), btn = $('btn'), l1 = $('l1'), l2 = $('l2'),
      ring = $('ring'), cursor = $('cursor'), pWrap = $('particles');

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
const easeInCubic = (t) => t * t * t;
const easeInOutCubic = (t) => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOutBack = (t, s = 1.9) => 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2);
const mix = (c1, c2, t) => c1.map((v, i) => Math.round(lerp(v, c2[i], t)));
const rgb = (c) => `rgb(${c[0]},${c[1]},${c[2]})`;

const GREEN = [0, 195, 137], GREY = [44, 54, 68], DARK = [8, 10, 15], WHITE = [255, 255, 255];
const W_FOLLOW = 250, W_FOLLOWED = 290;

// Particles (deterministic)
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const COLORS = ['#00C389', '#3EEBB2', '#F7C14B', '#FFD879', '#FFFFFF'];
const parts = Array.from({ length: 22 }, (_, i) => {
  const el = document.createElement('div');
  el.className = 'p';
  const size = 12 + rnd() * 16;
  el.style.width = el.style.height = size + 'px';
  el.style.background = COLORS[i % COLORS.length];
  pWrap.appendChild(el);
  return { el, size, ang: (i / 22) * Math.PI * 2 + rnd() * 0.4, dist: 150 + rnd() * 140, delay: rnd() * 0.08 };
});

const T_CLICK = 1.35;

function render(t) {
  // Card in / out
  const tin = prog(t, 0, 0.5), tout = prog(t, 3.05, 3.45);
  const cScale = lerp(0.55, 1, easeOutBack(tin)) * lerp(1, 0.85, easeInCubic(tout));
  const cY = lerp(80, 0, easeOutCubic(tin)) + lerp(0, 40, easeInCubic(tout));
  card.style.opacity = Math.min(easeOutCubic(prog(t, 0, 0.25)), 1 - tout);
  card.style.transform = `translateY(${cY}px) scale(${cScale})`;

  // Button: idle pulse, press, state change
  const pulse = t < T_CLICK - 0.15 ? Math.sin(prog(t, 0.55, T_CLICK - 0.15) * Math.PI * 2) : 0;
  const press = easeOutCubic(prog(t, T_CLICK - 0.12, T_CLICK)) - easeOutBack(prog(t, T_CLICK, T_CLICK + 0.3), 2.5);
  const bScale = 1 + Math.max(0, pulse) * 0.04 - press * 0.1;
  const s = easeInOutCubic(prog(t, T_CLICK, T_CLICK + 0.25));
  btn.style.width = lerp(W_FOLLOW, W_FOLLOWED, s) + 'px';
  btn.style.transform = `scale(${bScale})`;
  btn.style.background = rgb(mix(GREEN, GREY, s));
  btn.style.boxShadow = `0 0 ${lerp(40, 0, s) * (0.6 + 0.4 * Math.max(0, pulse))}px rgba(0,195,137,${0.55 * (1 - s)})`;
  l1.style.color = rgb(DARK); l2.style.color = rgb(WHITE);
  l1.style.opacity = 1 - prog(t, T_CLICK, T_CLICK + 0.12);
  l1.style.transform = `translateY(${-30 * easeInCubic(prog(t, T_CLICK, T_CLICK + 0.15))}px)`;
  const l2in = prog(t, T_CLICK + 0.08, T_CLICK + 0.35);
  l2.style.opacity = l2in;
  l2.style.transform = `translateY(${30 * (1 - easeOutCubic(l2in))}px) scale(${lerp(0.7, 1, easeOutBack(l2in))})`;

  // Button centre on the stage (card is layout-static apart from transform)
  const r = btn.getBoundingClientRect();
  const bx = r.left + r.width / 2, by = r.top + r.height / 2;

  // Ripple ring
  const rr = prog(t, T_CLICK, T_CLICK + 0.55);
  const rs = lerp(80, 360, easeOutCubic(rr));
  ring.style.width = ring.style.height = rs + 'px';
  ring.style.left = bx - rs / 2 + 'px'; ring.style.top = by - rs / 2 + 'px';
  ring.style.opacity = rr > 0 && rr < 1 ? (1 - rr) * 0.9 : 0;
  ring.style.borderWidth = lerp(12, 2, rr) + 'px';

  // Particle burst
  for (const p of parts) {
    const k = prog(t, T_CLICK + p.delay, T_CLICK + p.delay + 0.75);
    const d = p.dist * easeOutCubic(k);
    const x = bx + Math.cos(p.ang) * d, y = by + Math.sin(p.ang) * d * 0.85;
    const sc = k < 0.15 ? k / 0.15 : 1 - easeInCubic((k - 0.15) / 0.85);
    p.el.style.opacity = k > 0 && k < 1 ? 1 : 0;
    p.el.style.transform = `translate(${x - p.size / 2}px, ${y - p.size / 2}px) scale(${sc})`;
  }

  // Cursor: fly in, tap, leave
  const cin = easeOutCubic(prog(t, 0.45, 1.15));
  const cout = easeInCubic(prog(t, 1.85, 2.35));
  const tipX = bx + 34, tipY = by + 20;
  const cx = lerp(tipX + 260, tipX, cin) + lerp(0, 320, cout);
  const cy = lerp(tipY + 520, tipY, cin) + lerp(0, 420, cout);
  const cScaleC = 1 - press * 0.15;
  cursor.style.opacity = Math.min(prog(t, 0.45, 0.7), 1 - prog(t, 2.05, 2.35));
  cursor.style.transform = `translate(${cx - 15}px, ${cy - 15}px) rotate(-8deg) scale(${cScaleC})`;
  cursor.style.filter = `drop-shadow(0 ${lerp(14, 5, press)}px ${lerp(18, 8, press)}px rgba(0,0,0,0.45))`;
}

window.FPS = FPS; window.DURATION = DURATION; window.render = render;
render(0);
</script>
</body>
</html>
