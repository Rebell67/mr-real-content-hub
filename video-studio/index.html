<!doctype html>
<html
  lang="de"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"aroll","type":"string","label":"A-Roll (Pfad zum Clip)","default":"assets/placeholder/aroll-placeholder.mp4","placeholder":"assets/footage/mein-clip.mp4"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #080a0f;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }
      #aroll {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      [data-composition-id="main"] > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <!--
      Mr Real · Reel-Vorlage (9:16, 20 s)
      Spur 0  A-Roll   – eigenen Clip nach assets/footage/ legen, Variable "aroll" bzw. src setzen
      Spur 1  Hook     – 0–3,2 s
      Spur 2  Bauchbinde – 3,5–8 s
      Spur 3  CTA      – letzte 3,5 s
      Spur 4  Fortschrittsbalken – gesamte Länge
      Texte pro Reel über data-variable-values der jeweiligen Spur ändern.
    -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="20"
      data-width="1080"
      data-height="1920"
    >
      <video
        id="aroll"
        class="clip"
        src="assets/placeholder/aroll-placeholder.mp4"
        data-var-src="aroll"
        playsinline
        data-has-audio="true"
        data-start="0"
        data-duration="20"
        data-track-index="0"
        data-volume="1"
      ></video>

      <div
        id="el-hook"
        data-composition-id="mr-hook"
        data-composition-src="compositions/mr-hook.html"
        data-variable-values='{"kicker":"Immo-Wissen","hook":"Diesen Fehler machen 90 % beim ersten Wohnungskauf"}'
        data-start="0"
        data-duration="3.2"
        data-track-index="1"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="el-lower-third"
        data-composition-id="mr-lower-third"
        data-composition-src="compositions/mr-lower-third.html"
        data-variable-values='{"name":"Mr Real","role":"Immobilien · Wien"}'
        data-start="3.5"
        data-duration="4.5"
        data-track-index="2"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="el-cta"
        data-composition-id="mr-cta"
        data-composition-src="compositions/mr-cta.html"
        data-variable-values='{"handle":"@mr.r3al","cta":"Folgen für mehr Immo-Wissen","button":"Folgen"}'
        data-start="16.5"
        data-duration="3.5"
        data-track-index="3"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="el-progress"
        data-composition-id="mr-progress"
        data-composition-src="compositions/mr-progress.html"
        data-variable-values='{"length":20}'
        data-start="0"
        data-duration="20"
        data-track-index="4"
        data-width="1080"
        data-height="1920"
      ></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
