<!doctype html>
<html
  lang="de"
  data-composition-variables='[
    {"id":"length","type":"number","label":"Länge (s) – gleich wie Slot-Dauer","default":20,"min":1,"max":180,"step":0.5,"unit":"s"},
    {"id":"accent","type":"color","label":"Akzentfarbe","default":"#00C389"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
        }
        #mr-progress-track {
          position: absolute;
          left: 60px;
          right: 60px;
          top: 150px;
          height: 8px;
          border-radius: 8px;
          background: rgba(255, 255, 255, 0.14);
          overflow: hidden;
        }
        #mr-progress-fill {
          width: 100%;
          height: 100%;
          background: var(--accent);
          transform-origin: left center;
        }
      </style>
      <div id="root" data-composition-id="mr-progress" data-width="1080" data-height="1920">
        <div id="mr-progress-track"><div id="mr-progress-fill"></div></div>
      </div>
      <script>
        (() => {
          // document/Selektoren sind vom HyperFrames-Runtime auf diese Instanz begrenzt
          // (Voraussetzung: eindeutige data-composition-id am Slot, siehe CLAUDE.md).
          const $ = (sel) => document.querySelector(sel);
          const { length } = window.__hyperframes.getVariables();
          const tl = gsap.timeline({ paused: true });
          tl.fromTo($("#mr-progress-fill"), { scaleX: 0 }, { scaleX: 1, duration: Number(length) || 20, ease: "none" }, 0);
          window.__timelines["mr-progress"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
