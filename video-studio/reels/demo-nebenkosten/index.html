    <script>
      const tl = gsap.timeline({ paused: true });
      // Zooms: [Zeit, Skalierung, hart?]
      const zooms = [
        [0, 1.0, 1], [1.43, 1.16, 1], [3.72, 1.0, 1], [6.24, 1.12, 1], [8.28, 1.2, 1],
        [9.3, 1.0, 0], [11.37, 1.14, 1], [12.7, 1.0, 1], [16.12, 1.1, 1], [17.9, 1.0, 0],
      ];
      zooms.forEach(([t, s, hard]) => {
        tl.to("#cam", { scale: s, duration: hard ? 0.12 : 0.45, ease: hard ? "power3.out" : "power2.inOut" }, t);
      });
      // langsamer Push-in in ruhigen Passagen
      tl.fromTo("#cam", { scale: 1.0 }, { scale: 1.05, duration: 2.6, ease: "none", immediateRender: false }, 3.73);
      window.__timelines["main"] = tl;
