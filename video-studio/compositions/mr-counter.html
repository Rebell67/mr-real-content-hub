<!doctype html>
<html
  lang="de"
  data-composition-variables='[
    {"id":"name","type":"string","label":"Name","default":"Mr Real"},
    {"id":"handle","type":"string","label":"Handle","default":"@mr.r3al"},
    {"id":"label","type":"string","label":"Zähler-Label","default":"Follower"},
    {"id":"from","type":"number","label":"Startwert","default":1000},
    {"id":"to","type":"number","label":"Endwert","default":10000},
    {"id":"prefix","type":"string","label":"Präfix (z. B. €)","default":""},
    {"id":"suffix","type":"string","label":"Suffix (z. B. %)","default":""},
    {"id":"countAt","type":"number","label":"Zählen ab (s im Slot)","default":0.6,"min":0,"step":0.1,"unit":"s"},
    {"id":"countFor","type":"number","label":"Zähldauer","default":1.2,"min":0.2,"step":0.1,"unit":"s"},
    {"id":"y","type":"number","label":"Position (px von oben)","default":230,"min":180,"max":1500,"step":10,"unit":"px"},
    {"id":"accent","type":"color","label":"Akzentfarbe","default":"#00C389"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Inter";
          src: url("assets/fonts/Inter-Variable.woff2") format("woff2");
          font-weight: 100 900;
        }
        @font-face {
          font-family: "Space Grotesk";
          src: url("assets/fonts/SpaceGrotesk-Variable.woff2") format("woff2");
          font-weight: 300 700;
        }
        #root {
          position: absolute;
          inset: 0;
        }
        #mr-counter-card {
          position: absolute;
          left: 50%;
          top: calc(var(--y) * 1px);
          width: 760px;
          margin-left: -380px;
          display: flex;
          align-items: center;
          gap: 34px;
          padding: 30px 40px;
          border-radius: 36px;
          background: linear-gradient(160deg, rgba(34, 42, 54, 0.96), rgba(11, 14, 20, 0.96));
          border: 2px solid rgba(255, 255, 255, 0.1);
          box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.12);
          font-family: "Inter", sans-serif;
          color: #f4f6f8;
        }
        #mr-counter-avatar {
          flex: none;
          width: 128px;
          height: 128px;
          border-radius: 50%;
          display: flex;
          align-items: center;
          justify-content: center;
          background: radial-gradient(circle at 30% 30%, #12d99a, #00805b);
          font-family: "Space Grotesk", sans-serif;
          font-weight: 700;
          font-size: 50px;
          color: #06120d;
          border: 4px solid rgba(255, 255, 255, 0.18);
        }
        #mr-counter-text {
          display: flex;
          flex-direction: column;
          gap: 4px;
          min-width: 0;
        }
        #mr-counter-name {
          font-family: "Space Grotesk", sans-serif;
          font-weight: 700;
          font-size: 44px;
          letter-spacing: -0.02em;
        }
        #mr-counter-handle {
          font-size: 28px;
          color: #b8c2cf;
        }
        #mr-counter-stat {
          display: flex;
          align-items: baseline;
          gap: 14px;
          margin-top: 10px;
        }
        #mr-counter-value {
          display: block;
          padding: 4px 16px;
          border-radius: 14px;
          background: var(--accent);
          color: #06120d;
          font-family: "Space Grotesk", sans-serif;
          font-weight: 700;
          font-size: 52px;
          font-variant-numeric: tabular-nums;
        }
        #mr-counter-label {
          font-size: 30px;
          color: #b8c2cf;
        }
      </style>
      <div id="root" data-composition-id="mr-counter" data-width="1080" data-height="1920">
        <div id="mr-counter-card">
          <div id="mr-counter-avatar">MR</div>
          <div id="mr-counter-text">
            <span id="mr-counter-name" data-var-text="name">Mr Real</span>
            <span id="mr-counter-handle" data-var-text="handle">@mr.r3al</span>
            <div id="mr-counter-stat">
              <span id="mr-counter-value">1.000</span>
              <span id="mr-counter-label" data-var-text="label">Follower</span>
            </div>
          </div>
        </div>
      </div>
      <script>
        (() => {
          // document/Selektoren sind vom HyperFrames-Runtime auf diese Instanz begrenzt
          // (Voraussetzung: eindeutige data-composition-id am Slot, siehe CLAUDE.md).
          const $ = (sel) => document.querySelector(sel);
          // Texte aus den Instanz-Variablen setzen (data-var-text greift bei eindeutiger Slot-ID nicht immer
          // vor dem Skript – so ist es deterministisch)
          const vars = window.__hyperframes.getVariables();
          document.querySelectorAll("[data-var-text]").forEach((el) => {
            const v = vars[el.getAttribute("data-var-text")];
            if (v != null && v !== "") el.textContent = String(v);
          });
          const v = window.__hyperframes.getVariables();
          const from = Number(v.from) || 0;
          const to = Number(v.to) || 0;
          const fmt = (n) => (v.prefix || "") + Math.round(n).toLocaleString("de-AT").replace(/ /g, ".") + (v.suffix || "");
          const valueEl = $("#mr-counter-value");
          const state = { n: from };
          valueEl.textContent = fmt(from);
          const tl = gsap.timeline({ paused: true });
          tl.fromTo($("#mr-counter-card"), { opacity: 0, y: -60, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, 0);
          tl.fromTo(
            state,
            { n: from },
            {
              n: to,
              duration: Number(v.countFor) || 1.2,
              ease: "power2.inOut",
              onUpdate: () => (valueEl.textContent = fmt(state.n)),
            },
            Number(v.countAt) || 0.6,
          );
          tl.fromTo(
            "#mr-counter-value",
            { scale: 1 },
            { scale: 1.18, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out" },
            (Number(v.countAt) || 0.6) + (Number(v.countFor) || 1.2),
          );
          window.__timelines["mr-counter"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
